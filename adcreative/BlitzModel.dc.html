<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #0A0E17; }
    a:hover { color: #0A0E17; opacity: 0.85; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1080px; background: #0A0E17; overflow: hidden; font-family: 'Manrope', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column;">

  <!-- ambient glow -->
  <div style="position: absolute; top: -220px; right: -220px; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, rgba(76,141,255,0.28) 0%, rgba(34,211,238,0.10) 45%, rgba(10,14,23,0) 72%); pointer-events: none;"></div>
  <div style="position: absolute; bottom: -260px; left: -200px; width: 680px; height: 680px; border-radius: 50%; background: radial-gradient(circle, rgba(34,211,238,0.16) 0%, rgba(10,14,23,0) 70%); pointer-events: none;"></div>

  <!-- top bar: wordmark -->
  <div style="position: relative; display: flex; align-items: center; gap: 14px; padding: 48px 72px 0 72px; flex-shrink: 0;">
    <div style="width: 52px; height: 52px; border-radius: 12px; background: #0d1420; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 22px; background: linear-gradient(135deg, #4c8dff, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent;">TI</span>
    </div>
    <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.04em; color: #F5F7FA;">
      TRUE <span style="background: linear-gradient(135deg, #4c8dff, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent;">IMPERIUM</span>
    </div>
  </div>

  <!-- main content -->
  <div style="position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 84px; gap: 22px; overflow: hidden;">
    <div style="display: inline-flex; align-items: center; padding: 8px 20px; border-radius: 999px; background: rgba(76,141,255,0.10); border: 1px solid rgba(76,141,255,0.30);">
      <span style="font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; color: #7fb2ff;">The Schedule</span>
    </div>

    <!-- schedule tiles -->
    <div style="display: flex; align-items: center; gap: 18px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 30px; border-radius: 16px; background: rgba(76,141,255,0.10); border: 1px solid rgba(76,141,255,0.30);">
        <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #F5F7FA;">2</span>
        <span style="font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: #7fb2ff;">Weeks On</span>
      </div>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4c8dff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 30px; border-radius: 16px; background: rgba(34,211,238,0.08); border: 1px solid rgba(34,211,238,0.30);">
        <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 56px; line-height: 1; background: linear-gradient(135deg, #4c8dff, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent;">2</span>
        <span style="font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; color: #5eead4;">Weeks Off</span>
      </div>
    </div>

    <h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 58px; line-height: 1.15; color: #F5F7FA; max-width: 820px;">
      The Blitz Model —<br/><span style="background: linear-gradient(135deg, #4c8dff, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent;">Work Hard, Then Actually Rest.</span>
    </h1>

    <p style="margin: 0; font-family: 'Manrope', system-ui, sans-serif; font-weight: 500; font-size: 24px; letter-spacing: 0.02em; color: #6B7688; max-width: 700px;">
      Travel expenses fully covered. Flexible scheduling built around real time off.
    </p>
  </div>

  <!-- bottom CTA -->
  <div style="position: relative; display: flex; justify-content: center; padding: 0 72px 48px 72px; flex-shrink: 0;">
    <div style="display: inline-flex; align-items: center; gap: 10px; padding: 26px 56px; border-radius: 999px; background: linear-gradient(135deg, #4c8dff, #22d3ee); box-shadow: 0 18px 48px rgba(34,211,238,0.22);">
      <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 34px; color: #0A0E17;">Book a Call</span>
      <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 34px; color: #0A0E17;">&#8594;</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
