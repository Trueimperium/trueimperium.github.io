<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #0A0E17; }
    a:hover { color: #0A0E17; opacity: 0.85; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1920px; background: #0A0E17; overflow: hidden; font-family: 'Manrope', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column;">

  <!-- ambient glow -->
  <div style="position: absolute; top: -200px; right: -240px; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(76,141,255,0.26) 0%, rgba(34,211,238,0.10) 45%, rgba(10,14,23,0) 72%); pointer-events: none;"></div>
  <div style="position: absolute; bottom: 260px; left: -260px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(34,211,238,0.15) 0%, rgba(10,14,23,0) 70%); pointer-events: none;"></div>

  <!-- decorative ascending line -->
  <svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position: absolute; top: 0; left: 0; opacity: 0.45; pointer-events: none;">
    <defs>
      <linearGradient id="lineGradV" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#4c8dff"/>
        <stop offset="1" stop-color="#22d3ee"/>
      </linearGradient>
    </defs>
    <path d="M -40 1500 C 200 1480, 320 1300, 440 1180 C 580 1040, 680 900, 820 700 C 920 560, 980 440, 1140 260" fill="none" stroke="url(#lineGradV)" stroke-width="3" stroke-linecap="round"/>
  </svg>

  <!-- safe-zone top spacer (keep clear of profile/caption UI) -->
  <div style="height: 260px; flex-shrink: 0;"></div>

  <!-- wordmark -->
  <div style="position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 72px;">
    <div style="width: 52px; height: 52px; border-radius: 12px; background: #0d1420; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 22px; background: linear-gradient(135deg, #4c8dff, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent;">TI</span>
    </div>
    <div style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.04em; color: #F5F7FA;">
      TRUE <span style="background: linear-gradient(135deg, #4c8dff, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent;">IMPERIUM</span>
    </div>
  </div>

  <!-- main content -->
  <div style="position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 64px 84px 0 84px; gap: 32px;">
    <div style="display: inline-flex; align-items: center; padding: 10px 24px; border-radius: 999px; background: rgba(76,141,255,0.10); border: 1px solid rgba(76,141,255,0.30);">
      <span style="font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase; color: #7fb2ff;">Now Hiring</span>
    </div>

    <h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 104px; line-height: 1.08; color: #F5F7FA; text-wrap: pretty;">
      Your Income<br/>Has<br/>
      <span style="background: linear-gradient(135deg, #4c8dff, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent;">No Ceiling.</span>
    </h1>

    <p style="margin: 0; font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; font-size: 42px; line-height: 1.35; color: #C7CEDA; max-width: 820px;">
      Uncapped Commission.<br/>No Experience Needed.
    </p>

    <p style="margin: 0; font-family: 'Manrope', system-ui, sans-serif; font-weight: 500; font-size: 27px; letter-spacing: 0.02em; text-transform: uppercase; color: #6B7688;">
      In-Person Sales &amp; Marketing Careers
    </p>
  </div>

  <!-- bottom CTA -->
  <div style="position: relative; display: flex; justify-content: center; padding: 0 72px;">
    <div style="display: inline-flex; align-items: center; gap: 10px; padding: 28px 60px; border-radius: 999px; background: linear-gradient(135deg, #4c8dff, #22d3ee); box-shadow: 0 18px 48px rgba(34,211,238,0.22);">
      <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 36px; color: #0A0E17;">Book a Call</span>
      <span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 36px; color: #0A0E17;">&#8594;</span>
    </div>
  </div>

  <!-- safe-zone bottom spacer (keep clear of Reels/Stories caption + UI) -->
  <div style="height: 300px; flex-shrink: 0;"></div>

</div>
</x-dc>
</body>
</html>
